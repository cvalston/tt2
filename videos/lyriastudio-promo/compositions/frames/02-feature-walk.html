          position: absolute;

        /* full-bleed ground — a dedicated class="clip" layer, NOT a background on #root

          position: absolute;
          inset: 0;
          background: #080808;

        /* ---- camera rig: outer handles a cosmetic settle-scale only (tail beat),

          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;

        <!-- cursor + ripple ride in fixed screen space, above the camera/world transform -->
        <div class="f02-ripple" id="f02-ripple"></div>

          <svg width="34" height="34" viewBox="0 0 24 24">
            <g class="f02-cursor-inner" id="f02-cursor-inner">

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          var root = document.getElementById("root");
          var world = document.getElementById("f02-world");
          var camera = document.getElementById("f02-camera");
          var cursor = document.getElementById("f02-cursor");
          var cursorInner = document.getElementById("f02-cursor-inner");
          var ripple = document.getElementById("f02-ripple");

          // Panel top-Y in world/document space — matches the natural (untransformed)
          // stacking order of the four .f02-panel blocks (each 1080px tall).
          var PANEL = { vibe: 0, instr: 1080, tempo: 2160, arc: 3240 };

          // ---- Measure real geometry ONCE, at setup, while world/camera are still
          // identity transforms (no gsap.set/to has run yet) — see coordinate-target-zoom
          // rule: bake offsets from getBoundingClientRect, never hand-derive or re-measure
          // per frame. rects below are in natural (pre-pan) document space.
          var rootR = root.getBoundingClientRect();
          function centerOf(id) {
            var r = document.getElementById(id).getBoundingClientRect();
            return { x: r.left - rootR.left + r.width / 2, y: r.top - rootR.top + r.height / 2 };
          }
          var epicC = centerOf("f02-vibe-epic");
          var synthC = centerOf("f02-instr-synth");
          var drumsC = centerOf("f02-instr-drums");
          var buildC = centerOf("f02-arc-build");
          var trackR = document.getElementById("f02-tempo-track").getBoundingClientRect();
          var trackLocal = {
            left: trackR.left - rootR.left,
            centerY: trackR.top - rootR.top + trackR.height / 2,
            width: trackR.width,
          };

          // Convert a natural (panel-local) point to on-screen coords once the world
          // has panned so that `panelTop` sits at the top of the viewport.
          function onScreen(pt, panelTop) {
            return { x: pt.x, y: pt.y - panelTop };
          }

          // ---- initial state ----
          gsap.set(world, { y: 0 });
          gsap.set(camera, { scale: 1 });
          gsap.set(cursor, { x: -50, y: 1180 }); // off-frame, bottom-left of panel 1
          gsap.set(ripple, { opacity: 0, scale: 0 });

          function moveCursor(pt, at, dur, ease) {
            tl.to(cursor, { x: pt.x - 6, y: pt.y - 4, duration: dur, ease: ease || "power2.inOut" }, at);
          }

          function panTo(panelTop, at, dur) {
            tl.to(world, { y: -panelTop, duration: dur, ease: "power4.inOut" }, at);
          }

          // Outline-select (vibe / instrument tiles): press-compress + amber glow ring + ripple.
          // Only allowlisted props are tweened (opacity, scale) — never className/borderColor.
          function selectOutline(elId, pt, at) {
            var el = document.getElementById(elId);
            var glow = el.querySelector(".glow");
            tl.to(cursorInner, { scale: 0.8, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1 }, at);
            tl.fromTo(el, { scale: 1 }, { scale: 0.96, duration: 0.09, ease: "power1.in", yoyo: true, repeat: 1 }, at + 0.04);
            tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, at + 0.05);
            tl.set(ripple, { x: pt.x, y: pt.y, scale: 0, opacity: 1 }, at + 0.05);
            tl.to(ripple, { scale: 2.6, opacity: 0, duration: 0.5, ease: "power2.out" }, at + 0.06);
          }

          // Fill-select (energy-arc button): spring pop + amber fill + dark text/bars + glow + ripple.
          function selectFill(elId, pt, at) {
            var el = document.getElementById(elId);
            var glow = el.querySelector(".glow");
            var label = el.querySelector(".label");
            var bars = el.querySelectorAll(".bars i");
            tl.to(cursorInner, { scale: 0.8, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, at);
            tl.fromTo(el, { scale: 1 }, { scale: 1.05, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, at + 0.05);
            tl.to(el, { backgroundColor: "#F5A623", duration: 0.18, ease: "power2.out" }, at + 0.06);
            tl.to(label, { color: "rgba(8,8,8,0.75)", duration: 0.18, ease: "power2.out" }, at + 0.06);
            tl.to(bars, { backgroundColor: "rgba(8,8,8,0.75)", duration: 0.18, ease: "power2.out" }, at + 0.06);
            tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, at + 0.06);
            tl.set(ripple, { x: pt.x, y: pt.y, scale: 0, opacity: 1 }, at + 0.06);
            tl.to(ripple, { scale: 3.2, opacity: 0, duration: 0.55, ease: "power2.out" }, at + 0.07);
          }

          // ================= SCENE 1 (0.0-1.8s) — 01/VIBE, cursor enters, clicks Epic =================
          moveCursor({ x: 1120, y: 60 }, 0.05, 0.5, "power3.out");
          moveCursor(onScreen(epicC, PANEL.vibe), 0.55, 0.42);
          selectOutline("f02-vibe-epic", onScreen(epicC, PANEL.vibe), 1.0);
          tl.to(
            ["#f02-vibe-chill", "#f02-vibe-dark", "#f02-vibe-happy", "#f02-vibe-romantic", "#f02-vibe-tense", "#f02-vibe-dreamy", "#f02-vibe-energy"],
            { opacity: 0.55, duration: 0.3, ease: "power2.out" },
            1.18
          );

          // ================= SCENE 2 (1.8-4.0s) — whip-pan to 03/INSTRUMENTS, click Synth, Drums =================
          panTo(PANEL.instr, 1.8, 0.5);
          moveCursor(onScreen(synthC, PANEL.instr), 2.3, 0.4);
          selectOutline("f02-instr-synth", onScreen(synthC, PANEL.instr), 2.72);
          moveCursor(onScreen(drumsC, PANEL.instr), 3.12, 0.35);
          selectOutline("f02-instr-drums", onScreen(drumsC, PANEL.instr), 3.5);

          // ================= SCENE 3 (4.0-6.4s) — pan to 04/TEMPO, drag the slider thumb =================
          panTo(PANEL.tempo, 4.0, 0.5);
          var grabPt = onScreen({ x: trackLocal.left + 0.2417 * trackLocal.width, y: trackLocal.centerY }, PANEL.tempo);
          moveCursor(grabPt, 4.55, 0.4);
          tl.to(cursorInner, { scale: 0.85, duration: 0.1, ease: "power2.in" }, 4.95);

          var thumbEl = document.getElementById("f02-tempo-thumb");
          var fillEl = document.getElementById("f02-tempo-fill");
          var wordEl = document.getElementById("f02-tempo-word");
          var bpmEl = document.getElementById("f02-tempo-bpm");
          var drag = { p: 0.2417 };
          tl.to(
            drag,
            {
              p: 0.62,
              duration: 1.1,
              ease: "power2.inOut",
              onUpdate: function () {
                thumbEl.style.left = drag.p * 100 + "%";
                fillEl.style.transform = "scaleX(" + drag.p + ")";
                var bpm = Math.round(40 + drag.p * (200 - 40));
                bpmEl.textContent = bpm;
                var word =
                  bpm < 60 ? "Meditative" :
                  bpm < 80 ? "Slow" :
                  bpm < 100 ? "Laid-back" :
                  bpm < 115 ? "Moderate" :
                  bpm < 130 ? "Upbeat" :
                  bpm < 150 ? "Driving" :
                  bpm < 175 ? "Fast" : "Frantic";
                wordEl.textContent = word;
              },
            },
            5.05
          );
          tl.to(
            cursor,
            { x: trackLocal.left + 0.62 * trackLocal.width - 6, duration: 1.1, ease: "power2.inOut" },
            5.05
          );
          tl.to(cursorInner, { scale: 1, duration: 0.15, ease: "power2.out" }, 6.1);

          // ================= SCENE 4 (6.4-9.0s) — pan to 05/ENERGY ARC, click "Build Up", HOLD =================
          panTo(PANEL.arc, 6.4, 0.5);
          moveCursor(onScreen(buildC, PANEL.arc), 6.95, 0.35, "back.out(1.2)");
          selectFill("f02-arc-build", onScreen(buildC, PANEL.arc), 7.3);

          // camera comes to rest — a barely-perceptible settle scale sells "static hold";
          // fires only after every measurement-dependent move above has already landed.
          tl.to(camera, { scale: 1.015, duration: 0.7, ease: "power2.out" }, 7.9);

          window.__timelines["02-feature-walk"] = tl;
        })();
      </script>
    </template>
