<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>InnerShift — sting</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "DM Mono";
        src: url("assets/fonts/dmmono-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "DM Mono";
        src: url("assets/fonts/dmmono-500.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07090b;
      }
      body {
        font-family: "Fraunces", serif;
        color: #e8ecef;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* ---- ambient ground: deep canvas + a faint teal glow, matching the
             app's own --prism-canvas-0 / --prism-teal-glow tokens ---- */
      #is-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 900px 560px at 50% 38%, rgba(74, 179, 162, 0.10) 0%, transparent 70%),
          #07090b;
      }

      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      /* ---- Scene 1+2: eyebrow + wordmark title card ---- */
      #is-title-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        will-change: transform, opacity, filter;
      }
      #is-eyebrow {
        font-family: "DM Mono", monospace;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #4ab3a2;
      }
      #is-wordmark {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 128px;
        letter-spacing: -0.01em;
        line-height: 1;
        color: #e8ecef;
      }
      #is-underline {
        width: 220px;
        height: 3px;
        background: #4ab3a2;
        transform-origin: 0% 50%;
        transform: scaleX(0);
      }

      /* ---- Scene 3: closing kinetic line ---- */
      #is-line-wrap {
        max-width: 1400px;
        text-align: center;
        will-change: transform, opacity, filter;
      }
      #is-line {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 78px;
        letter-spacing: -0.01em;
        line-height: 1.15;
        text-transform: lowercase;
      }
      #is-line .accent {
        color: #e6b258;
      }

      /* ---- Scene 4: closing sting (small wordmark returns) ---- */
      #is-outro-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        will-change: transform, opacity;
      }
      #is-outro-mark {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 84px;
        color: #e8ecef;
      }
      #is-outro-tag {
        font-family: "DM Mono", monospace;
        font-weight: 400;
        font-size: 17px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #4ab3a2;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.6"
      data-width="1920"
      data-height="1080"
    >
      <div id="is-bg" class="clip" data-start="0" data-duration="7.6" data-track-index="0"></div>

      <!-- Scene 1-2 (0.0-3.3s): eyebrow rises, wordmark springs in, underline draws, holds -->
      <div id="is-title" class="clip" data-start="0" data-duration="3.3" data-track-index="1">
        <div id="is-title-wrap">
          <div id="is-eyebrow">Quiet Signal &middot; Dusk</div>
          <div id="is-wordmark">InnerShift</div>
          <div id="is-underline"></div>
        </div>
      </div>

      <!-- Scene 3 (3.3-6.2s): "generate your personalized session" lands, holds, clears -->
      <div id="is-line" class="clip" data-start="3.3" data-duration="2.9" data-track-index="1">
        <div id="is-line-wrap">
          <div id="is-line-text">generate your <span class="accent">personalized</span> session</div>
        </div>
      </div>

      <!-- Scene 4 (6.2-7.6s, final frame): small wordmark + tag closes the sting, holds -->
      <div id="is-outro" class="clip" data-start="6.2" data-duration="1.4" data-track-index="1">
        <div id="is-outro-wrap">
          <div id="is-outro-mark">InnerShift</div>
          <div id="is-outro-tag">Calm, on your terms</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const titleWrap = document.getElementById("is-title-wrap");
      const eyebrow = document.getElementById("is-eyebrow");
      const wordmark = document.getElementById("is-wordmark");
      const underline = document.getElementById("is-underline");
      const lineWrap = document.getElementById("is-line-wrap");
      const outroWrap = document.getElementById("is-outro-wrap");

      // ---- Scene 1 (0.0-1.1s): eyebrow rises in ----
      tl.fromTo(eyebrow, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);

      // ---- Scene 2 (1.1-2.6s): wordmark springs in beneath, underline draws ----
      tl.fromTo(
        wordmark,
        { y: 24, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        1.1,
      );
      tl.fromTo(underline, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.75);

      // ---- Scene 2 end -> 3 (3.0-3.3s): Zoom-Through (forward) exit — cut-catalog recipe ----
      tl.to(titleWrap, { scale: 1.16, filter: "blur(9px)", duration: 0.3, ease: "power3.in" }, 3.0);
      tl.to(titleWrap, { opacity: 0, duration: 0.3, ease: "none" }, 3.0);
      tl.set(titleWrap, { opacity: 0 }, 3.3);

      // ---- Scene 3 (3.3-6.2s): closing line lands from the zoom-through, holds, clears ----
      tl.set(lineWrap, { opacity: 0.15, scale: 0.78, filter: "blur(9px)" }, 3.3);
      tl.to(lineWrap, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 3.3);
      tl.to(lineWrap, { opacity: 0, scale: 0.94, duration: 0.3, ease: "power2.in" }, 5.9);
      tl.set(lineWrap, { opacity: 0 }, 6.2);

      // ---- Scene 4 (6.2-7.6s, final frame): outro wordmark settles and holds ----
      tl.fromTo(
        outroWrap,
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        6.2,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
